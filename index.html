<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1018" />
    <meta name="description" content="Questões de vestibular que funcionam até sem internet." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Maratona — Questões offline</title>
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('maratona.theme');
          if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'dark';
          document.documentElement.dataset.theme = preference;
          var light = preference === 'light' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', light ? '#f5f2ea' : '#0d1018');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
